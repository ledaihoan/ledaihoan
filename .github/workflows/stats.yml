name: Refresh profile stats

on:
  schedule:
    # Mondays 00:17 UTC — off the hour so it isn't queued behind the cron rush.
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Update the stats block
        run: node .github/scripts/update-stats.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "README unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile stats"
          git push
